name: Bug report
description: Report a reproducible problem without sharing credentials or private data.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not paste cookies, tokens, proxy passwords or private URLs. Remove those values from logs and Diagnostics reports.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Installation or startup
        - Download or probe
        - Subscriptions
        - Files or playback
        - Diagnostics or update
        - User interface
        - Other
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include exact steps and a redacted error message or Diagnostics report.
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Operating system and Python version
      placeholder: Windows 11, Python 3.12
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: yt-dlp version
  - type: checkboxes
    id: safety
    attributes:
      label: Sensitive data check
      options:
        - label: I removed cookies, tokens, passwords and private URLs from this report.
          required: true
