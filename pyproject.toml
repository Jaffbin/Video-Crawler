[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "video-grabber-local"
version = "0.1.0"
description = "A private local video and audio downloader powered by yt-dlp and ffmpeg"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "yt-dlp[curl-cffi,default,deno]",
]

[project.optional-dependencies]
desktop = ["pywebview", "pystray>=0.19.5,<0.20", "Pillow>=10,<13", "windows-toasts>=1.3.1,<2; sys_platform == 'win32'"]
render = ["playwright"]
dev = ["pytest>=8,<10", "ruff>=0.14,<1"]
# Local speech-to-text for Library transcripts. Models download on first use.
ai = ["faster-whisper>=1.1,<2"]
# MCP server for AI agents (grab_mcp.py), a client of the local automation API.
mcp = ["mcp>=2.3,<3"]

[tool.setuptools]
py-modules = ["grab", "grab_api", "grab_archive", "grab_auto_rules", "grab_backup", "grab_cleanup", "grab_config", "grab_cookies", "grab_download", "grab_errors", "grab_hooks", "grab_images", "grab_library", "grab_mcp", "grab_mediaexport", "grab_organizer", "grab_plugins", "grab_push", "grab_remote", "grab_repair", "grab_schedule", "grab_transcribe", "grab_desktop", "grab_notifications", "grab_models", "grab_sites", "grab_state", "grab_storage", "grab_subscriptions", "webui", "webui_legacy_html", "webui_routes_api", "webui_routes_jobs", "webui_remote_page", "webui_routes_library", "webui_routes_remote", "webui_routes_subscriptions", "webui_routes_system", "webui_routes_transcripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
