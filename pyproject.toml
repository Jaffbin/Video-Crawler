[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "video-grabber-local"
version = "0.1.0"
description = "A private local video and audio downloader powered by yt-dlp and ffmpeg"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "yt-dlp[curl-cffi,default,deno]",
]

[project.optional-dependencies]
desktop = ["pywebview", "pystray>=0.19.5,<0.20", "Pillow>=10,<13", "windows-toasts>=1.3.1,<2; sys_platform == 'win32'"]
render = ["playwright"]
dev = ["pytest>=8,<10", "ruff>=0.14,<1"]

[tool.setuptools]
py-modules = ["grab", "grab_backup", "grab_config", "grab_download", "grab_images", "grab_library", "grab_organizer", "grab_repair", "grab_desktop", "grab_notifications", "grab_models", "grab_sites", "grab_state", "grab_storage", "webui", "webui_legacy_html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
